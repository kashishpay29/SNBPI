<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNB Engg. — Proforma Invoice Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C0392B;--red2:#E74C3C;--dark:#1F2937;
  --gray:#6B7280;--lgray:#E5E7EB;--offwhite:#F9FAFB;--white:#fff;
  --body:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif;
}
body{font-family:var(--body);background:var(--offwhite);color:var(--dark);min-height:100vh}
.app{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
.form-panel{background:var(--white);border-right:1px solid var(--lgray);overflow-y:auto;height:100vh;position:sticky;top:0}
.preview-panel{padding:24px;background:#E8EAED;overflow-y:auto;min-height:100vh}
.panel-header{background:var(--red);padding:18px 24px;position:sticky;top:0;z-index:10}
.panel-header h1{font-family:var(--display);font-size:20px;font-weight:800;color:var(--white);letter-spacing:0.04em}
.panel-header p{font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px}
.form-body{padding:18px 24px}
.form-section{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--lgray)}
.form-section:last-child{border-bottom:none}
.section-title{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title::before{content:'';width:14px;height:2px;background:var(--red)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.field-row.single{grid-template-columns:1fr}
.field-row.triple{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:0.06em}
.field input,.field textarea,.field select{padding:7px 9px;border:1px solid var(--lgray);border-radius:4px;font-family:var(--body);font-size:13px;color:var(--dark);background:var(--white);outline:none;transition:border-color 0.15s;-webkit-appearance:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red)}
.field textarea{resize:vertical;min-height:52px}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.toggle-row label{font-size:11px;color:var(--dark);font-weight:500}
.toggle-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--red);cursor:pointer}
/* items form — card layout so the product-name field always has room to type */
.item-card{border:1px solid var(--lgray);border-radius:6px;margin-bottom:8px;overflow:hidden}
.item-card-top{display:flex;gap:8px;align-items:flex-start;padding:8px;background:var(--offwhite);border-bottom:1px solid var(--lgray)}
.item-num{flex-shrink:0;width:16px;padding-top:8px;font-size:11px;font-weight:700;color:var(--red);text-align:center}
.item-card-top .mini-field{flex:1;min-width:0}
.item-card-top textarea{min-height:50px}
.item-del{flex-shrink:0;background:none;border:none;color:var(--gray);cursor:pointer;font-size:18px;line-height:1;padding:4px;margin-top:2px;transition:color 0.15s}
.item-del:hover{color:var(--red)}
.item-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;padding:8px}
.mini-field{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini-field label{font-size:8.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-field input,.mini-field textarea{padding:6px 7px;border:1px solid var(--lgray);border-radius:3px;font-family:var(--body);font-size:12px;color:var(--dark);width:100%;outline:none;background:var(--offwhite);text-align:right}
.mini-field input:focus,.mini-field textarea:focus{border-color:var(--red);background:var(--white)}
.mini-field textarea{text-align:left;resize:vertical;min-height:50px}
.mini-field.readout .item-calc{padding:6px 7px;font-size:12px;font-weight:700;color:var(--dark);text-align:right;white-space:nowrap;overflow:hidden;background:var(--lgray);border-radius:3px;min-height:16px}
.mini-field.total .item-calc{color:var(--red);background:#FBEAE8}
.add-item-btn{width:100%;padding:9px;background:var(--offwhite);border:1px dashed var(--lgray);border-radius:6px;font-family:var(--body);font-size:11px;font-weight:600;color:var(--gray);cursor:pointer;transition:all 0.15s}
.add-item-btn:hover{background:var(--lgray);color:var(--dark)}
.actions{padding:14px 24px;background:var(--offwhite);border-top:1px solid var(--lgray);position:sticky;bottom:0;display:flex;gap:8px}
.btn-primary{flex:1;padding:10px;background:var(--red);color:var(--white);border:none;border-radius:4px;font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:0.06em;cursor:pointer;text-transform:uppercase;transition:background 0.15s}
.btn-primary:hover{background:var(--red2)}
.btn-sec{padding:10px 14px;background:var(--white);color:var(--dark);border:1px solid var(--lgray);border-radius:4px;font-family:var(--body);font-size:12px;font-weight:600;cursor:pointer}
.btn-sec:hover{border-color:var(--dark)}
/* preview */
.preview-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.preview-toolbar h2{font-size:13px;font-weight:600;color:var(--gray)}
.pdf-page{background:var(--white);width:794px;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,0.15);font-family:var(--body);padding:12px 12px 24px;border:1.5px solid var(--dark)}

/* ══ PROFORMA PDF STYLES ══ */
.p-header{border:1.5px solid var(--dark);margin:8px;border-bottom:none}
.p-top{display:grid;grid-template-columns:116px 1fr auto;border-bottom:1.5px solid var(--dark)}
.p-logo-box{border-right:1px solid var(--dark);display:flex;align-items:center;justify-content:center;background:#C0392B;min-width:116px}
.p-company{padding:8px 12px;text-align:center}
.p-company h1{font-family:var(--display);font-size:28px;font-weight:800;color:var(--red);letter-spacing:0.06em;line-height:1}
.p-company p{font-size:9.5px;color:var(--dark);line-height:1.6;margin-top:4px}
.p-copies{border:1px solid var(--dark);padding:8px 12px;min-width:220px;display:flex;align-items:center;justify-content:center;text-align:center}
.p-copy-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:9.5px;color:var(--dark)}
.p-copy-dot{width:11px;height:11px;border:1.5px solid var(--dark);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;color:var(--red);flex-shrink:0}
.p-title-row{border-bottom:1.5px solid var(--dark);display:flex;justify-content:space-between;align-items:center;padding:5px 12px}
.p-title-row h2{font-family:var(--display);font-size:20px;font-weight:800;color:var(--dark);letter-spacing:0.08em}
.p-meta p{font-size:10.5px;color:var(--dark);line-height:1.8;text-align:right}
.p-rc-transport{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--lgray);font-size:9.5px;color:var(--dark)}
.p-rc-transport div{padding:3px 12px;border-right:1px solid var(--lgray)}
.p-rc-transport div:last-child{border-right:none}
.p-state-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--dark)}
.p-state-box{padding:3px 12px;font-size:9.5px;color:var(--dark);border-right:1px solid var(--dark)}
.p-state-box:last-child{border-right:none}
.p-addresses{display:grid;grid-template-columns:1fr 1fr;margin:0 8px;border:1.5px solid var(--dark);border-top:none}
.p-addr-box{padding:8px 12px;border-right:1px solid var(--dark)}
.p-addr-box:last-child{border-right:none}
.p-addr-label{font-size:9.5px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;border-bottom:1px solid var(--lgray);padding-bottom:3px}
.p-addr-box strong{font-size:12px;font-weight:700;color:var(--dark);display:block}
.p-addr-box p{font-size:10.5px;color:var(--dark);line-height:1.6}
.p-po-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--dark);font-size:9.5px;color:var(--dark)}
.p-po-row div{padding:3px 12px;border-right:1px solid var(--lgray)}
.p-po-row div:last-child{border-right:none}
/* items table */
.p-items{margin:0 8px}
.p-tbl{width:100%;border-collapse:collapse;border:1.5px solid var(--dark);font-size:9.5px;table-layout:fixed}
.p-tbl th{padding:5px 4px;background:var(--dark);color:var(--white);font-size:8.5px;font-weight:700;text-align:center;border:1px solid #374151;white-space:nowrap;overflow:hidden}
.p-tbl th.sub{background:#374151;font-size:8px}
.p-tbl td{padding:4px 4px;border:1px solid var(--lgray);color:var(--dark);vertical-align:top}
.p-tbl td.c{text-align:center}
.p-tbl td.r{text-align:right}
.p-tbl td.b{font-weight:700}
.p-tbl td.desc{font-size:9.5px;line-height:1.4}
.p-tbl tr.grand td{background:var(--offwhite);font-weight:700;border-top:1.5px solid var(--dark)}
/* bottom */
.p-bottom{display:grid;grid-template-columns:1fr 1fr;margin:0 8px;border:1.5px solid var(--dark);border-top:none}
.p-bottom-left{border-right:1px solid var(--dark);padding:8px 10px}
.p-bottom-right{padding:6px 10px}
.p-amount-words{font-size:9.5px;color:var(--dark);line-height:1.5;margin-bottom:6px;border-bottom:1px solid var(--lgray);padding-bottom:5px}
.p-amount-words strong{font-size:10.5px;color:var(--red)}
.p-bank{font-size:9.5px;color:var(--dark);line-height:1.75}
.p-bank h4{font-size:9.5px;font-weight:700;color:var(--dark);margin-bottom:3px;border-bottom:1px solid var(--lgray);padding-bottom:3px}
.p-tax-row{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dark);padding:2px 0;border-bottom:1px solid var(--lgray)}
.p-tax-row.grand{font-weight:700;font-size:12px;border-bottom:none;padding-top:5px}
.p-tax-row.grand span:last-child{color:var(--red)}
/* footer */
.p-footer{display:grid;grid-template-columns:1fr 1fr;margin:0 8px;border:1.5px solid var(--dark);border-top:none}
.p-footer-left{border-right:1px solid var(--dark);padding:8px 10px;font-size:9.5px;color:var(--gray);line-height:1.6}
.p-footer-right{padding:8px 10px;text-align:right}
.p-footer-right p{font-size:11px;font-weight:700;color:var(--dark)}
.p-sig{margin-top:55px;border-top:1px solid var(--dark);padding-top:4px;font-size:9.5px;color:var(--gray)}
.p-eoae{margin:4px 8px;font-size:9.5px;color:var(--gray);font-style:italic}

@media(max-width:1300px){
  .app{grid-template-columns:360px 1fr}
  .pdf-page{transform:scale(0.9);transform-origin:top center}
}
@media print{
  @page{size:A4 portrait;margin:15mm}
  html,body{width:auto;height:auto;background:white;overflow:visible}
  .form-panel,.preview-toolbar,.actions{display:none !important}
  .app{display:block !important}
  .preview-panel{padding:0;background:white;overflow:visible;min-height:unset}
  .pdf-page{
    box-shadow:none;
    width:100%;
    min-height:auto;
    margin:0;
    padding:0;
    border:none;
    transform:none !important;
    page-break-after:auto;
    overflow:visible;
  }
  .p-header,.p-addresses,.p-bottom,.p-footer,.p-eoae{
    page-break-inside:avoid;
    overflow:visible;
  }
  .p-items{
    overflow:visible;
  }
  .p-tbl{
    page-break-inside:auto;
  }
  .p-tbl thead{
    display:table-header-group;
  }
  .p-tbl tr{
    page-break-inside:avoid;
    page-break-after:auto;
  }
}
</style>
</head>
<body>
<div class="app">

<!-- ══ FORM PANEL ══ -->
<div class="form-panel">
  <div class="panel-header">
    <h1>SNB ENGG. Proforma Invoice</h1>
    <p>Fill in details — preview updates live</p>
  </div>
  <div class="form-body">

    <div class="form-section">
      <div class="section-title">Invoice Details</div>
      <div class="field-row">
        <div class="field"><label>Proforma No.</label><input id="invNo" value="SNB-PI-001" oninput="render()"></div>
        <div class="field"><label>Invoice Date</label><input id="invDate" type="date" oninput="render()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Transport Mode</label><input id="transport" value="Courier" oninput="render()"></div>
        <div class="field"><label>Vehicle Number</label><input id="vehicle" value="N.A" oninput="render()"></div>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="reverseCharge" oninput="render()">
        <label for="reverseCharge">Reverse Charge Applicable</label>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Billed To (Customer)</div>
      <div class="field-row single"><div class="field"><label>Company Name</label><input id="billName" placeholder="Customer Name" oninput="render()"></div></div>
      <div class="field-row single"><div class="field"><label>Address Line 1</label><input id="billAddr1" oninput="render()"></div></div>
      <div class="field-row single"><div class="field"><label>Address Line 2</label><input id="billAddr2" oninput="render()"></div></div>
      <div class="field-row">
        <div class="field"><label>City</label><input id="billCity" oninput="render()"></div>
        <div class="field"><label>State</label><input id="billState" oninput="render()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>PIN</label><input id="billPin" oninput="render()"></div>
        <div class="field"><label>State Code</label><input id="billStateCode" oninput="render()"></div>
      </div>
      <div class="field-row single"><div class="field"><label>GSTIN</label><input id="billGst" oninput="render()"></div></div>
    </div>

    <div class="form-section">
      <div class="section-title">Shipped To (Consignee)</div>
      <div class="toggle-row">
        <input type="checkbox" id="sameAddress" checked onchange="toggleSameAddr()">
        <label>Same as Bill To</label>
      </div>
      <div id="shipFields" style="display:none">
        <div class="field-row single"><div class="field"><label>Company Name</label><input id="shipName" oninput="render()"></div></div>
        <div class="field-row single"><div class="field"><label>Address Line 1</label><input id="shipAddr1" oninput="render()"></div></div>
        <div class="field-row single"><div class="field"><label>Address Line 2</label><input id="shipAddr2" oninput="render()"></div></div>
        <div class="field-row">
          <div class="field"><label>City</label><input id="shipCity" oninput="render()"></div>
          <div class="field"><label>State</label><input id="shipState" oninput="render()"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>PIN</label><input id="shipPin" oninput="render()"></div>
          <div class="field"><label>State Code</label><input id="shipStateCode" oninput="render()"></div>
        </div>
        <div class="field-row single"><div class="field"><label>GSTIN</label><input id="shipGst" oninput="render()"></div></div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">PO / Reference Details</div>
      <div class="field-row triple">
        <div class="field"><label>PO No.</label><input id="poNo" oninput="render()"></div>
        <div class="field"><label>PO Date</label><input id="poDate" type="date" oninput="render()"></div>
        <div class="field"><label>Vendor Code</label><input id="vendorCode" oninput="render()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Kind Attention</label><input id="kindAttn" oninput="render()"></div>
        <div class="field"><label>Job Done At</label><input id="jobDoneAt" oninput="render()"></div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Tax Type</div>
      <div class="toggle-row">
        <input type="radio" name="gstType" id="igst" value="igst" checked onchange="render()">
        <label for="igst">IGST (Interstate)</label>
        <input type="radio" name="gstType" id="cgst_sgst" value="cgst_sgst" onchange="render()" style="margin-left:16px">
        <label for="cgst_sgst">CGST + SGST (Intrastate)</label>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Line Items</div>
      <div id="itemsContainer"></div>
      <button class="add-item-btn" onclick="addItem()">+ Add Line Item</button>
    </div>

    <div class="form-section">
      <div class="section-title">Bank Details</div>
      <div class="field-row single"><div class="field"><label>Bank Name</label><input id="bankName" value="HDFC BANK" oninput="render()"></div></div>
      <div class="field-row single"><div class="field"><label>Account Holder Name</label><input id="bankAccName" value="SNB ENGG." oninput="render()"></div></div>
      <div class="field-row">
        <div class="field"><label>Account No.</label><input id="bankAccNo" value="50200061262588" oninput="render()"></div>
        <div class="field"><label>IFSC Code</label><input id="bankIfsc" value="HDFC0001077" oninput="render()"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Account Type</label><input id="bankAccType" value="Current Account" oninput="render()"></div>
        <div class="field"><label>Branch</label><input id="bankBranch" value="BEVERLY PARK, Mira Road East, Thane" oninput="render()"></div>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">Terms & Conditions</div>
      <div class="field-row single"><div class="field"><label>Terms (one per line)</label>
        <textarea id="terms" rows="4" placeholder="Payment due within 30 days.&#10;Goods once dispatched will not be returned." oninput="render()"></textarea>
      </div></div>
    </div>

  </div>
  <div class="actions">
    <button class="btn-sec" onclick="resetForm()">Reset</button>
    <button class="btn-primary" onclick="window.print()">⬇ Download PDF</button>
  </div>
</div>

<!-- ══ PREVIEW PANEL ══ -->
<div class="preview-panel">
  <div class="preview-toolbar">
    <h2>Live Preview — Proforma Invoice</h2>
    <span style="font-size:12px;color:var(--gray)">A4 Portrait</span>
  </div>
  <div id="invPreview" class="pdf-page"></div>
</div>
</div>

<script>
const GSTIN = "27HEKPS1128L1ZY";
const SNB_PHONE = "7303466822";
const SNB_ADDR = ["Office No: C-002, Shree Samriddhi Bldg","Behind Happy Home Heights, Poonam Garden","S.K. Stone, Mira Road (East), Thane — 401107"];

const SVG_LOGO = `<svg width="108" height="108" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <rect width="108" height="108" fill="#C0392B"/>
  <rect x="30" y="34" width="32" height="44" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2.8"/>
  <rect x="36" y="40" width="20" height="12" rx="1.5" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <line x1="26" y1="78" x2="66" y2="78" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M62 44 Q72 44 72 52 L72 58" fill="none" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M68 58 L76 58 L76 65 L68 65 Z" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>
  <text x="54" y="96" font-family="Georgia,serif" font-size="8.5" font-weight="bold" letter-spacing="3.5" fill="#ffffff" text-anchor="middle">SNB ENGG</text>
</svg>`;

let items = [{desc:'',hsn:'',unit:'NOS',qty:'1',rate:'',cgst:'0',sgst:'0',igst:'18'}];

window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('invDate').value=new Date().toISOString().split('T')[0];
  renderItemRows();render();
});

function toggleSameAddr(){
  document.getElementById('shipFields').style.display=document.getElementById('sameAddress').checked?'none':'block';
  render();
}

function addItem(){
  const igstType=document.querySelector('input[name=gstType]:checked')?.value==='igst';
  items.push({desc:'',hsn:'',unit:'NOS',qty:'1',rate:'',
    cgst:igstType?'0':'9',sgst:igstType?'0':'9',igst:igstType?'18':'0'});
  renderItemRows();render();
}
function removeItem(i){if(items.length===1)return;items.splice(i,1);renderItemRows();render();}

function renderItemRows(){
  document.getElementById('itemsContainer').innerHTML=items.map((item,i)=>`
    <div class="item-card">
      <div class="item-card-top">
        <div class="item-num">${i+1}</div>
        <div class="mini-field">
          <label>Name of Product / Service</label>
          <textarea oninput="ui(${i},'desc',this.value)">${item.desc}</textarea>
        </div>
        <button class="item-del" onclick="removeItem(${i})" title="Remove item">×</button>
      </div>
      <div class="item-card-grid">
        <div class="mini-field"><label>HSN/SAC</label><input value="${item.hsn}" placeholder="HSN" oninput="ui(${i},'hsn',this.value)"></div>
        <div class="mini-field"><label>UOM</label><input value="${item.unit}" placeholder="NOS" oninput="ui(${i},'unit',this.value)"></div>
        <div class="mini-field"><label>Qty</label><input type="number" value="${item.qty}" oninput="ui(${i},'qty',this.value)"></div>
        <div class="mini-field"><label>Rate (₹)</label><input type="number" value="${item.rate}" placeholder="0.00" oninput="ui(${i},'rate',this.value)"></div>
        <div class="mini-field"><label>CGST %</label><input type="number" value="${item.cgst}" placeholder="0" oninput="ui(${i},'cgst',this.value)"></div>
        <div class="mini-field readout"><label>CGST Amt</label><div class="item-calc" id="icg-${i}">${fmtC(base(item)*(parseFloat(item.cgst)||0)/100)}</div></div>
        <div class="mini-field"><label>SGST %</label><input type="number" value="${item.sgst}" placeholder="0" oninput="ui(${i},'sgst',this.value)"></div>
        <div class="mini-field readout"><label>SGST Amt</label><div class="item-calc" id="isg-${i}">${fmtC(base(item)*(parseFloat(item.sgst)||0)/100)}</div></div>
        <div class="mini-field"><label>IGST %</label><input type="number" value="${item.igst}" placeholder="18" oninput="ui(${i},'igst',this.value)"></div>
        <div class="mini-field readout"><label>IGST Amt</label><div class="item-calc" id="iig-${i}">${fmtC(base(item)*(parseFloat(item.igst)||0)/100)}</div></div>
        <div class="mini-field readout total"><label>Total (₹)</label><div class="item-calc" id="itot-${i}">${fmtC(total(item))}</div></div>
      </div>
    </div>`).join('');
}

function ui(i,f,v){
  items[i][f]=v;
  const b=base(items[i]);
  const cg=b*(parseFloat(items[i].cgst)||0)/100;
  const sg=b*(parseFloat(items[i].sgst)||0)/100;
  const ig=b*(parseFloat(items[i].igst)||0)/100;
  const el=id=>document.getElementById(id);
  if(el('icg-'+i)) el('icg-'+i).textContent=fmtC(cg);
  if(el('isg-'+i)) el('isg-'+i).textContent=fmtC(sg);
  if(el('iig-'+i)) el('iig-'+i).textContent=fmtC(ig);
  if(el('itot-'+i)) el('itot-'+i).textContent=fmtC(b+cg+sg+ig);
  render();
}

function base(item){return(parseFloat(item.qty)||0)*(parseFloat(item.rate)||0);}
function total(item){
  const b=base(item);
  return b+b*((parseFloat(item.cgst)||0)+(parseFloat(item.sgst)||0)+(parseFloat(item.igst)||0))/100;
}
function fmtC(n){return n?n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}):'';}
function fmt(n,dec=2){return n.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function fmtDate(d){if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}-${m}-${y}`;}
function g(id){return document.getElementById(id)?.value||'';}

function calcTotals(){
  let sub=0,cg=0,sg=0,ig=0;
  items.forEach(item=>{
    const b=base(item);
    sub+=b;cg+=b*(parseFloat(item.cgst)||0)/100;
    sg+=b*(parseFloat(item.sgst)||0)/100;ig+=b*(parseFloat(item.igst)||0)/100;
  });
  return{sub,cg,sg,ig,tax:cg+sg+ig,grand:sub+cg+sg+ig};
}

function numToWords(n){
  const a=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
  const b=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  function t(n){
    if(n<20)return a[n];if(n<100)return b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');
    if(n<1000)return a[Math.floor(n/100)]+' HUNDRED'+(n%100?' '+t(n%100):'');
    if(n<100000)return t(Math.floor(n/1000))+' THOUSAND'+(n%1000?' '+t(n%1000):'');
    if(n<10000000)return t(Math.floor(n/100000))+' LAKH'+(n%100000?' '+t(n%100000):'');
    return t(Math.floor(n/10000000))+' CRORE'+(n%10000000?' '+t(n%10000000):'');
  }
  const int=Math.floor(n),dec=Math.round((n-int)*100);
  return(t(int)||'ZERO')+(dec?' AND '+t(dec)+' PAISE':'')+' RUPEES ONLY';
}
